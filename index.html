<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myridiculouswebsite.pizza</title>
    <style>
        /* --- CORE CONFIGURATION --- */
        :root {
            --bg-color: #e5e5e5;
            --text-color: #000000;
            
            --tile-red: #d24726;
            --tile-blue: #00AEEF;
            --tile-crimson: #b01c3c;
            --tile-darkblue: #173a73;
            --tile-grey: #404040;
            --tile-green: #107c10;
            --tile-default: #2b2b2b;
            
            /* Fixed sizes to prevent squishing */
            --cell-size: 80px; 
            --gap-size: 10px;
            --grid-limit: 6; 

            --ease-metro: cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1d1d1d;
                --text-color: #ffffff;
            }
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', 'Segoe UI Light', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh; 
            overflow-x: hidden;
        }

        #start-screen {
            width: 100%;
            height: 100%;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            overflow-x: auto;
            transition: transform 0.5s var(--ease-metro), opacity 0.4s ease;
        }

        .header-section { margin-bottom: 20px; flex-shrink: 0; }
        .page-title { font-size: 3rem; font-weight: 300; }

        /* --- GRID SYSTEM --- */
        .tile-grid {
            display: grid;
            gap: var(--gap-size);
            /* Fixed rows on desktop to prevent vertical squishing */
            grid-template-rows: repeat(var(--grid-limit), var(--cell-size));
            grid-auto-flow: column;
            grid-auto-columns: var(--cell-size);
            height: fit-content;
            padding-bottom: 50px;
        }

        /* TILE SIZES - Using grid-area for cleaner management */
        .small  { grid-column: span 1; grid-row: span 1; }
        .medium { grid-column: span 2; grid-row: span 2; }
        .wide   { grid-column: span 4; grid-row: span 2; }
        .large  { grid-column: span 4; grid-row: span 4; }

        .tile {
            position: relative;
            cursor: pointer;
            overflow: hidden; 
            color: white;
            background-color: var(--tile-default);
            transition: transform 0.1s;
        }
        .tile:active { transform: scale(0.98); }

        /* COLORS */
        .bg-red { background-color: var(--tile-red); }
        .bg-blue { background-color: var(--tile-blue); }
        .bg-crimson { background-color: var(--tile-crimson); }
        .bg-darkblue { background-color: var(--tile-darkblue); }
        .bg-grey { background-color: var(--tile-grey); }
        .bg-green { background-color: var(--tile-green); }

        /* --- MOBILE/VERTICAL OVERRIDE --- */
        @media (max-width: 800px) {
            #start-screen {
                padding: 20px;
                overflow-y: auto;
                overflow-x: hidden;
            }
            .tile-grid {
                grid-template-columns: 1fr; /* Force single column */
                grid-template-rows: auto;
                grid-auto-flow: row;
                width: 100%;
            }
            /* Make tiles behave better in vertical stack */
            .small, .medium, .wide, .large {
                grid-column: span 1 !important;
                grid-row: span 1 !important;
                height: 120px; /* Uniform height for mobile list style */
            }
            .page-title { font-size: 2rem; }
        }

        /* --- CONTENT STYLING --- */
        .tile-slider { width: 100%; height: 100%; position: relative; }
        .live .tile-slider { animation: tile-slide 10s infinite; }
        
        @keyframes tile-slide {
            0%, 45% { transform: translateY(0); }
            52%, 93% { transform: translateY(-100%); }
            100% { transform: translateY(0); }
        }

        .tile-face { 
            position: absolute; width: 100%; height: 100%; 
            padding: 10px; display: flex; flex-direction: column; 
        }
        .face-back { top: 100%; }

        .tile-center-icon { 
            flex-grow: 1; display: flex; align-items: center; 
            justify-content: center; font-size: 40px; 
        }

        .tile-text-main { 
            font-size: 13px; line-height: 1.2; 
            padding-bottom: 25px; /* Leave room for the label */
        }

        .tile-label { 
            position: absolute; bottom: 5px; left: 8px;
            font-size: 11px; font-weight: 600; text-transform: lowercase;
            background: rgba(0,0,0,0.2); padding: 2px 4px;
            z-index: 5;
        }

        /* APP CONTAINERS */
        .app-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: var(--bg-color); z-index: 100; 
            transform: translateX(100%); transition: transform 0.4s var(--ease-metro);
            display: flex; flex-direction: column;
        }
        .app-container.active { transform: translateX(0); }
        .app-header { padding: 20px; display: flex; align-items: center; gap: 15px; }
        .app-content { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .back-button { border: 2px solid currentColor; background: none; border-radius: 50%; cursor: pointer; color: inherit; width: 40px; height: 40px; }
        
        .zoom-out { opacity: 0; transform: scale(0.9); pointer-events: none; }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="header-section">
            <h1 class="page-title">myridiculouswebsite.pizza</h1>
        </div>

        <div class="tile-grid">
            <div class="tile medium bg-red live" onclick="openApp('app-about')">
                <div class="tile-slider">
                    <div class="tile-face face-front"><div class="tile-center-icon">👤</div></div>
                    <div class="tile-face face-back"><span class="tile-text-main">about me, my interests, and more!</span></div>
                </div>
                <span class="tile-label">about</span>
            </div>

            <div class="tile wide bg-blue live" onclick="openApp('app-projects')">
                <div class="tile-slider">
                    <div class="tile-face face-front"><div class="tile-center-icon">💻</div></div>
                    <div class="tile-face face-back"><span class="tile-text-main">projects I was involved in</span></div>
                </div>
                <span class="tile-label">projects</span>
            </div>

            <div class="tile medium bg-crimson live" onclick="openApp('app-links')">
                <div class="tile-slider">
                    <div class="tile-face face-front"><div class="tile-center-icon">🔗</div></div>
                    <div class="tile-face face-back"><span class="tile-text-main">links to some of my socials</span></div>
                </div>
                <span class="tile-label">links</span>
            </div>

            <div class="tile medium bg-darkblue live" onclick="openApp('app-faq')">
                 <div class="tile-slider">
                    <div class="tile-face face-front"><div class="tile-center-icon">❓</div></div>
                    <div class="tile-face face-back"><span class="tile-text-main">frequently asked questions</span></div>
                </div>
                <span class="tile-label">FAQ</span>
            </div>

            <div class="tile medium bg-grey live" onclick="openApp('app-others')">
                <div class="tile-slider">
                    <div class="tile-face face-front"><div class="tile-center-icon">💡</div></div>
                    <div class="tile-face face-back"><span class="tile-text-main">miscellaneous stuff</span></div>
                </div>
                <span class="tile-label">others</span>
            </div>
        </div>
    </div>

    <div id="app-about" class="app-container">
        <div class="app-header"><button class="back-button" onclick="goHome()">⬅</button><h2>about</h2></div>
        <div class="app-content"><p>Hello, I'm Acer!</p></div>
    </div>
    <div id="app-projects" class="app-container">
        <div class="app-header"><button class="back-button" onclick="goHome()">⬅</button><h2>projects</h2></div>
        <div class="app-content"><p>My cool projects list.</p></div>
    </div>
    <script>
        function openApp(appId) {
            document.getElementById('start-screen').classList.add('zoom-out');
            document.getElementById(appId).classList.add('active');
        }

        function goHome() {
            document.getElementById('start-screen').classList.remove('zoom-out');
            document.querySelectorAll('.app-container').forEach(app => app.classList.remove('active'));
        }
    </script>
</body>
</html>
