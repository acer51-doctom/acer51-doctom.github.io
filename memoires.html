<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mémoires</title>
    <style>
    
        body {
            display: flex; /* Utilise Flexbox pour la mise en page */
            flex-direction: column; /* Aligne les éléments de haut en bas */
            justify-content: center; /* Centre verticalement */
            align-items: center; /* Centre horizontalement */
            height: 100vh; /* Prend toute la hauteur de la fenêtre */
            margin: 0; /* Enlève les marges par défaut */
            font-family: Arial, sans-serif; /* Une police simple et lisible */
            background-color: #f4f4f9; /* Une couleur de fond douce */
            color: #333; /* Couleur du texte */
        }

        .contenu {
            text-align: center; /* Centre le texte à l'intérieur de la boîte */
            padding: 30px;
            background-color: white;
            border-radius: 10px; /* Coins arrondis */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Petite ombre légère */
        }
    </style>
</head>
<body>

    <div class="contenu">
        <h1>Mémoires</h1>
        <p>Mémoires.</p>
    </div>

</body>
</html>
